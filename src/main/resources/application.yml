server:
  port: 8080

app:
  upload:
    max-file-size: 5MB
    allowed-image-types:
      - image/jpeg
      - image/png
      - image/webp

storage:
  s3:
    bucket: ${S3_BUCKET:eventhub-media-tnphuoc-2026}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    region: ${S3_REGION:us-east-1}
    public-base-url: ${S3_PUBLIC_BASE_URL:https://eventhub-media-tnphuoc-2026.s3.us-east-1.amazonaws.com}

spring:
  application:
    name: event-ticket-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:event_ticket_db}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  jackson:
    time-zone: Asia/Ho_Chi_Minh

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: info