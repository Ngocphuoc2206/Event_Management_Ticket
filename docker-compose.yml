version: "3.9"

services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_ORGANIZER_CREATE_EVENT_ENDPOINT: ${NEXT_PUBLIC_ORGANIZER_CREATE_EVENT_ENDPOINT}
        NEXT_PUBLIC_LOGIN_ENDPOINT: ${NEXT_PUBLIC_LOGIN_ENDPOINT}
        NEXT_PUBLIC_REGISTER_ENDPOINT: ${NEXT_PUBLIC_REGISTER_ENDPOINT}
        NEXT_PUBLIC_LOGOUT_ENDPOINT: ${NEXT_PUBLIC_LOGOUT_ENDPOINT}
        NEXT_PUBLIC_REFRESH_ENDPOINT: ${NEXT_PUBLIC_REFRESH_ENDPOINT}
        NEXT_PUBLIC_USER_PROFILE_ENDPOINT: ${NEXT_PUBLIC_USER_PROFILE_ENDPOINT}
        NEXT_PUBLIC_CHANGE_PASSWORD_ENDPOINT: ${NEXT_PUBLIC_CHANGE_PASSWORD_ENDPOINT}
        NEXT_PUBLIC_ADMIN_USERS_ENDPOINT: ${NEXT_PUBLIC_ADMIN_USERS_ENDPOINT}
        NEXT_PUBLIC_MY_NOTIFICATIONS_ENDPOINT: ${NEXT_PUBLIC_MY_NOTIFICATIONS_ENDPOINT}
        NEXT_PUBLIC_ORDERS_ENDPOINT: ${NEXT_PUBLIC_ORDERS_ENDPOINT}
        NEXT_PUBLIC_MY_ORDERS_ENDPOINT: ${NEXT_PUBLIC_MY_ORDERS_ENDPOINT}
        NEXT_PUBLIC_PAYMENTS_ENDPOINT: ${NEXT_PUBLIC_PAYMENTS_ENDPOINT}
        NEXT_PUBLIC_MY_TICKETS_ENDPOINT: ${NEXT_PUBLIC_MY_TICKETS_ENDPOINT}
    container_name: eventhub-frontend
    ports:
      - "${APP_PORT}:3000"
    restart: unless-stopped
