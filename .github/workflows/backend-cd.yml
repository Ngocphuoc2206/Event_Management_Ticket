name: Backend CD

on:
  pull_request:
    branches:
      - master
    types:
      - closed

jobs:
  deploy-backend:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Copy backend source to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "src,pom.xml,Dockerfile,docker-compose.yml,.dockerignore,mvnw,.mvn"
          target: "/home/ubuntu/apps/eventhub/backend-prod/source"

      - name: Deploy backend on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/apps/eventhub/backend-prod/source

            cat > .env <<EOF
            SERVER_PORT=8080
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            S3_BUCKET=${{ secrets.S3_BUCKET }}
            S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
            S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
            S3_REGION=${{ secrets.S3_REGION }}
            S3_PUBLIC_BASE_URL=${{ secrets.S3_PUBLIC_BASE_URL }}
            MOCK_WEBHOOK_SECRET=${{ secrets.MOCK_WEBHOOK_SECRET }}
            EOF

            docker compose down || true
            docker compose up -d --build
            sleep 15
            curl -f http://localhost:8080/actuator/health || exit 1
            docker image prune -af || true