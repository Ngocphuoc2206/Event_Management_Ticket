name: Frontend CD

on:
  push:
    branches:
      - develop
      - main

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Determine target folder
        id: target
        run: |
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            echo "folder=frontend-staging" >> $GITHUB_OUTPUT
          else
            echo "folder=frontend-prod" >> $GITHUB_OUTPUT
          fi

      - name: Copy frontend source to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "src,public,package.json,package-lock.json,next.config.ts,Dockerfile,docker-compose.yml,.dockerignore,tsconfig.json,postcss.config.mjs,eslint.config.mjs"
          target: "/home/ubuntu/apps/eventhub/${{ steps.target.outputs.folder }}/source"

      - name: Deploy frontend on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/apps/eventhub/${{ steps.target.outputs.folder }}/source

            cat > .env <<EOF
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_ORGANIZER_CREATE_EVENT_ENDPOINT=${{ secrets.NEXT_PUBLIC_ORGANIZER_CREATE_EVENT_ENDPOINT }}
            NEXT_PUBLIC_LOGIN_ENDPOINT=${{ secrets.NEXT_PUBLIC_LOGIN_ENDPOINT }}
            NEXT_PUBLIC_REGISTER_ENDPOINT=${{ secrets.NEXT_PUBLIC_REGISTER_ENDPOINT }}
            NEXT_PUBLIC_LOGOUT_ENDPOINT=${{ secrets.NEXT_PUBLIC_LOGOUT_ENDPOINT }}
            NEXT_PUBLIC_REFRESH_ENDPOINT=${{ secrets.NEXT_PUBLIC_REFRESH_ENDPOINT }}
            NEXT_PUBLIC_USER_PROFILE_ENDPOINT=${{ secrets.NEXT_PUBLIC_USER_PROFILE_ENDPOINT }}
            NEXT_PUBLIC_CHANGE_PASSWORD_ENDPOINT=${{ secrets.NEXT_PUBLIC_CHANGE_PASSWORD_ENDPOINT }}
            NEXT_PUBLIC_ADMIN_USERS_ENDPOINT=${{ secrets.NEXT_PUBLIC_ADMIN_USERS_ENDPOINT }}
            NEXT_PUBLIC_MY_NOTIFICATIONS_ENDPOINT=${{ secrets.NEXT_PUBLIC_MY_NOTIFICATIONS_ENDPOINT }}
            NEXT_PUBLIC_ORDERS_ENDPOINT=${{ secrets.NEXT_PUBLIC_ORDERS_ENDPOINT }}
            NEXT_PUBLIC_MY_ORDERS_ENDPOINT=${{ secrets.NEXT_PUBLIC_MY_ORDERS_ENDPOINT }}
            NEXT_PUBLIC_PAYMENTS_ENDPOINT=${{ secrets.NEXT_PUBLIC_PAYMENTS_ENDPOINT }}
            NEXT_PUBLIC_MY_TICKETS_ENDPOINT=${{ secrets.NEXT_PUBLIC_MY_TICKETS_ENDPOINT }}
            NEXT_PUBLIC_ORGANIZER_EVENTS_ENDPOINT=${{ secrets.NEXT_PUBLIC_ORGANIZER_EVENTS_ENDPOINT }}
            NEXT_PUBLIC_ORGANIZER_API_BASE=${{ secrets.NEXT_PUBLIC_ORGANIZER_API_BASE }}
            NEXT_PUBLIC_ORGANIZER_MEDIA_UPLOAD_ENDPOINT=${{ secrets.NEXT_PUBLIC_ORGANIZER_API_BASE }}
            APP_PORT=${{ secrets.APP_PORT }}
            EOF

            docker compose down || true
            docker compose up -d --build
            docker image prune -af || true
