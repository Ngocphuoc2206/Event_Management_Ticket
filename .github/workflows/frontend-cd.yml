name: Frontend CD

on:
  push:
    branches:
      - develop
      - main

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Determine target folder
        id: target
        run: |
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            echo "folder=frontend-staging" >> $GITHUB_OUTPUT
          else
            echo "folder=frontend-prod" >> $GITHUB_OUTPUT
          fi

      - name: Copy frontend source to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/apps/eventhub/${{ steps.target.outputs.folder }}/source"

      - name: Deploy frontend on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/apps/eventhub/${{ steps.target.outputs.folder }}/source

            cp /home/ubuntu/apps/eventhub/${{ steps.target.outputs.folder }}/.env .env

            docker compose down || true
            docker compose up -d --build
            docker image prune -af
